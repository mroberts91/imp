name: Release Pipeline

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write # Required to create git tags and GitHub Releases
  id-token: write # Required for keyless artifact signing with Cosign

jobs:
  release:
    name: Auto-Tag and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser requires full history to generate the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          # Optional: Add a pre-release suffix (like -rc) if merging to develop
          append_to_pre_release_tag: ${{ github.ref == 'refs/heads/develop' && 'rc' || '' }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force GoReleaser to use the tag we just generated in the previous step
          GORELEASER_CURRENT_TAG: ${{ steps.tag_version.outputs.new_tag }}
