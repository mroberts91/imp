version: 2

project_name: imp

before:
  hooks:
    - go mod tidy

# Two binaries (the M1+ layout): impd releases for Linux only — it is the
# deploy target (cgroups, execd, systemd/OpenRC bootstrap); a darwin impd
# would build but cannot run a host. impctl releases wherever an operator
# might sit. CGO stays off — the SQLite driver is pure Go for exactly this.
builds:
  - id: impd
    main: ./cmd/impd
    binary: impd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildTime={{.Date}}

  # impctl is built per-OS so each archive has a uniform binary set
  # (goreleaser refuses mixed-count multi-binary archives).
  - id: impctl-linux
    main: ./cmd/impctl
    binary: impctl
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildTime={{.Date}}

  - id: impctl-darwin
    main: ./cmd/impctl
    binary: impctl
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildTime={{.Date}}

archives:
  # The host bundle: daemon + CLI + install scripts + example manifests.
  - id: imp
    builds: [impd, impctl-linux]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - bootstrap/**
      - examples/*.yaml
  # CLI-only archive for platforms that never run impd (darwin).
  - id: impctl
    builds: [impctl-darwin]
    formats: [tar.gz]
    name_template: >-
      impctl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'

# Keyless artifact signing via Cosign & GitHub OIDC.
signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
