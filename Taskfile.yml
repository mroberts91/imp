version: '3'

vars:
  ENV: dev

  IMPD: ./cmd/impd
  IMPCTL: ./cmd/impctl
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BRANCH:
    sh: git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: '{{if eq OS "windows"}}powershell -NoProfile -Command "(Get-Date).ToUniversalTime().ToString(\"yyyy-MM-ddTHH:mm:ssZ\")"{{else}}date -u +%Y-%m-%dT%H:%M:%SZ{{end}}'
  VERSION_FLAGS: -X main.branch={{.BRANCH}} -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}
  LDFLAGS: -ldflags "-s -w {{.VERSION_FLAGS}}"
  BUILDVCS: -buildvcs=false

dotenv:
  - .env.local # Highest priority - local developer overrides
  - .env.{{.ENV}} # Environment-specific settings
  - .env # Base defaults (lowest priority)

tasks:
  default:
    desc: Display available tasks
    cmds:
      - task --list
    silent: true

  blv:
    desc: Format, Build, Lint, Vet
    cmds:
      - task: fmt
      - task: build
      - task: lint
      - task: vet

  build:
    desc: Build impd and impctl for the host platform
    cmds:
      - go build {{.BUILDVCS}} {{.LDFLAGS}} -v -o bin/impd{{.EXE}} {{.IMPD}}
      - go build {{.BUILDVCS}} {{.LDFLAGS}} -v -o bin/impctl{{.EXE}} {{.IMPCTL}}

  build:linux:
    desc: Build static Linux x64 binaries (deploy target)
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-linux-amd64 {{.IMPD}}
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-linux-amd64 {{.IMPCTL}}
    env:
      CGO_ENABLED: "0"

  build:all:
    desc: Build for linux/darwin/windows × amd64/arm64
    cmds:
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:darwin-amd64
      - task: build:darwin-arm64
      - task: build:windows-amd64
      - task: build:windows-arm64
      - echo "All builds complete. Binaries in dist/"

  build:linux-amd64:
    desc: Build for Linux x64
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-linux-amd64 {{.IMPD}}
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-linux-amd64 {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  build:linux-arm64:
    desc: Build for Linux ARM64
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-linux-arm64 {{.IMPD}}
      - GOOS=linux GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-linux-arm64 {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  build:darwin-amd64:
    desc: Build for macOS x64 (Intel)
    cmds:
      - mkdir -p dist
      - GOOS=darwin GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-darwin-amd64 {{.IMPD}}
      - GOOS=darwin GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-darwin-amd64 {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  build:darwin-arm64:
    desc: Build for macOS ARM64 (Apple Silicon)
    cmds:
      - mkdir -p dist
      - GOOS=darwin GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-darwin-arm64 {{.IMPD}}
      - GOOS=darwin GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-darwin-arm64 {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  build:windows-amd64:
    desc: Build for Windows x64
    cmds:
      - mkdir -p dist
      - GOOS=windows GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-windows-amd64.exe {{.IMPD}}
      - GOOS=windows GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-windows-amd64.exe {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  build:windows-arm64:
    desc: Build for Windows ARM64
    cmds:
      - mkdir -p dist
      - GOOS=windows GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impd-windows-arm64.exe {{.IMPD}}
      - GOOS=windows GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/impctl-windows-arm64.exe {{.IMPCTL}}
    env: { CGO_ENABLED: "0" }

  # ---- Run (ad-hoc: current user, XDG dirs, no root) ----

  bootstrap:adhoc:
    desc: Create per-user XDG dirs for imp and print how to start it
    deps: [build]
    cmds:
      - ./bootstrap/install.sh ad-hoc
    platforms: [linux, darwin]

  run:
    desc: Run impd in the foreground as the current user (ad-hoc bootstrap)
    deps: [build]
    cmds:
      - ./bootstrap/install.sh ad-hoc --run
    platforms: [linux, darwin]

  ctl:
    desc: 'Run impctl against the ad-hoc impd (usage: task ctl -- get daemons)'
    preconditions:
      - sh: test -x bin/impctl
        msg: bin/impctl not built yet — run `task build` (or `task run` in another session) first
    cmds:
      # Same socket path the ad-hoc bootstrap uses (install.sh cmd_adhoc).
      # No build dep: `task run` already builds, and a rebuild per command
      # would make the dev loop sluggish.
      - IMP_SOCKET="${XDG_RUNTIME_DIR:-/tmp/imp-$(id -u)}/imp/impd.sock" bin/impctl {{.CLI_ARGS}}
    platforms: [linux, darwin]

  # ---- Acceptance ----

  accept:m1:
    desc: Rootless M1 acceptance (manifest GitOps → Running → logs → kill-9 backoff → sweep → SIGTERM)
    deps: [build]
    cmds:
      - bash scripts/m1-acceptance.sh
    platforms: [linux]

  accept:m2:
    desc: Rootless M2 acceptance (crash-loop → describe/events/get -w → SIGTERM)
    deps: [build]
    cmds:
      - bash scripts/m2-acceptance.sh
    platforms: [linux]

  accept:m3:
    desc: Rootless M3 acceptance (limits+readiness, liveness, metrics, D1 adopt, kill-on-shutdown)
    deps: [build]
    cmds:
      - bash scripts/m3-acceptance.sh
    platforms: [linux]

  accept:m4:
    desc: Rootless M4 acceptance (RollingUpdate high→low, D2 IMP_REPLICA_INDEX, SIGTERM)
    deps: [build]
    cmds:
      - bash scripts/m4-acceptance.sh
    platforms: [linux]

  accept:m5:
    desc: Rootless M5 acceptance (Timer, log retention, top, completion, SIGTERM)
    deps: [build]
    cmds:
      - bash scripts/m5-acceptance.sh
    platforms: [linux]

  accept:m6:
    desc: Rootless M6 acceptance (shim hardening, cpu.max, startupProbe, rollout safety, restart/run verbs)
    deps: [build]
    cmds:
      - bash scripts/m6-acceptance.sh
    platforms: [linux]

  accept:m7:
    desc: Rootless M7 acceptance (noNewPrivileges, capability validation, 126-honesty, restart --rolling)
    deps: [build]
    cmds:
      - bash scripts/m7-acceptance.sh
    platforms: [linux]

  accept:m8:
    desc: Rootless M8 acceptance (Config materialize/consume, roll-on-change, validation, missing-config hold, delete-in-use honesty)
    deps: [build]
    cmds:
      - bash scripts/m8-acceptance.sh
    platforms: [linux]

  accept:m9:
    desc: Rootless M9 acceptance (log pump, config path/modes/binary + conflict, maxUnavailable, timer timeZone/jitter/catchUp, selectors, top)
    deps: [build]
    cmds:
      - bash scripts/m9-acceptance.sh
    platforms: [linux]

  accept:m10:
    desc: Rootless M10 acceptance (Notifier crash-loop/RunFailed/cooldown/selector/no-meta, filesystem 126-honesty, get/describe notifiers, GC cascade)
    deps: [build]
    cmds:
      - bash scripts/m10-acceptance.sh
    platforms: [linux]

  # ---- Quality ----

  fmt:
    desc: Format Go
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify Go formatting (CI)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files need formatting:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Lint and static-check
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Lint with auto-fix
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run tests with race detector + coverage
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
    platforms: [linux, darwin]

  test:windows:
    desc: Run tests without race detector (Windows)
    cmds:
      - go test -v -coverprofile=coverage.out ./...
    platforms: [windows]

  test:short:
    desc: Run tests in short mode (skip integration)
    cmds:
      - go test -short ./...

  coverage:
    desc: Generate HTML coverage report
    deps: [test]
    cmds:
      - go tool cover -html=coverage.out

  coverage:text:
    desc: Print text coverage summary
    deps: [test]
    cmds:
      - go tool cover -func=coverage.out

  check:
    desc: fmt + vet + lint + test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # ---- Deps ----

  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  deps:check:
    desc: Check all dependencies for updates
    cmds:
      - go list -u -m all

  deps:update:
    desc: Update all dependencies to latest
    cmds:
      - go get -u all
      - go mod tidy

  # ---- Packaging & deploy ----

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/ coverage.out
    platforms: [linux, darwin]

  clean:windows:
    desc: Remove build artifacts (Windows)
    cmds:
      - cmd /c if exist bin rmdir /s /q bin
      - cmd /c if exist dist rmdir /s /q dist
      - cmd /c if exist coverage.out del /q coverage.out
    platforms: [windows]
