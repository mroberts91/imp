version: '3'

vars:
  ENV: dev

  APP: imp
  SERVER: ./cmd/imp-api-server
  CONT: ./cmd/imp-controllers
  ETCL: ./cmd/imp-etcl
  EXECD: ./cmd/imp-execd
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BRANCH:
    sh: git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: '{{if eq OS "windows"}}powershell -NoProfile -Command "(Get-Date).ToUniversalTime().ToString(\"yyyy-MM-ddTHH:mm:ssZ\")"{{else}}date -u +%Y-%m-%dT%H:%M:%SZ{{end}}'
  VERSION_FLAGS: -X main.branch={{.BRANCH}} -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.buildTime={{.BUILD_TIME}}
  LDFLAGS: -ldflags "-s -w {{.VERSION_FLAGS}}"
  BUILDVCS: -buildvcs=false

dotenv:
  - .env.local # Highest priority - local developer overrides
  - .env.{{.ENV}} # Environment-specific settings
  - .env # Base defaults (lowest priority)

tasks:
  default:
    desc: Display available tasks
    cmds:
      - task --list
    silent: true

  blv:
    desc: Format, Build, Lint, Vet
    cmds:
      - task: fmt
      - task: build
      - task: lint
      - task: vet

  build:
    desc: Build frontal-trading for the host platform
    cmds:
      - go build {{.BUILDVCS}} {{.LDFLAGS}} -v -o bin/{{.APP}}{{.EXE}} {{.SERVER}}

  build:linux:
    desc: Build a static Linux x64 binary (deploy target)
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-linux-amd64 {{.SERVER}}
    env:
      CGO_ENABLED: "0"

  build:all:
    desc: Build for linux/darwin/windows × amd64/arm64
    cmds:
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:darwin-amd64
      - task: build:darwin-arm64
      - task: build:windows-amd64
      - task: build:windows-arm64
      - echo "All builds complete. Binaries in dist/"

  build:linux-amd64:
    desc: Build for Linux x64
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-linux-amd64 {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  build:linux-arm64:
    desc: Build for Linux ARM64
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-linux-arm64 {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  build:darwin-amd64:
    desc: Build for macOS x64 (Intel)
    cmds:
      - mkdir -p dist
      - GOOS=darwin GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-darwin-amd64 {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  build:darwin-arm64:
    desc: Build for macOS ARM64 (Apple Silicon)
    cmds:
      - mkdir -p dist
      - GOOS=darwin GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-darwin-arm64 {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  build:windows-amd64:
    desc: Build for Windows x64
    cmds:
      - mkdir -p dist
      - GOOS=windows GOARCH=amd64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-windows-amd64.exe {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  build:windows-arm64:
    desc: Build for Windows ARM64
    cmds:
      - mkdir -p dist
      - GOOS=windows GOARCH=arm64 go build {{.BUILDVCS}} -trimpath {{.LDFLAGS}} -o dist/{{.APP}}-windows-arm64.exe {{.SERVER}}
    env: { CGO_ENABLED: "0" }

  # ---- Quality ----

  fmt:
    desc: Format Go
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Verify Go formatting (CI)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files need formatting:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Lint and static-check
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Lint with auto-fix
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run tests with race detector + coverage
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
    platforms: [linux, darwin]

  test:windows:
    desc: Run tests without race detector (Windows)
    cmds:
      - go test -v -coverprofile=coverage.out ./...
    platforms: [windows]

  test:short:
    desc: Run tests in short mode (skip integration)
    cmds:
      - go tool gotestsum --format testname ./... -short

  coverage:
    desc: Generate HTML coverage report
    deps: [test]
    cmds:
      - go tool cover -html=coverage.out

  coverage:text:
    desc: Print text coverage summary
    deps: [test]
    cmds:
      - go tool cover -func=coverage.out

  check:
    desc: fmt + vet + lint + test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # ---- Deps ----

  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  deps:check:
    desc: Check all dependencies for updates
    cmds:
      - go list -u -m all

  deps:update:
    desc: Update all dependencies to latest
    cmds:
      - go get -u all
      - go mod tidy

  # ---- Analytics (Python, uv-managed) ----

  analytics:sync:
    desc: Install analytics (Python) dependencies via uv
    dir: analytics
    cmds:
      - uv sync

  analytics:test:
    desc: Run the analytics (Python) test suite
    dir: analytics
    cmds:
      - uv run pytest

  backfill:
    desc: 'Backfill IEM station history into the store (P1 T9). Extra flags after --: task backfill -- --years 3 --force'
    cmds:
      - uv run --project analytics python -m analytics.backfill {{.CLI_ARGS}}

  goldens:sign:
    desc: Regenerate Kalshi signature-parity goldens via the official Python SDK
    dir: analytics
    cmds:
      - uv run python scripts/gen_sign_goldens.py

  # ---- Packaging & deploy ----

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/ coverage.out
    platforms: [linux, darwin]

  clean:windows:
    desc: Remove build artifacts (Windows)
    cmds:
      - cmd /c if exist bin rmdir /s /q bin
      - cmd /c if exist dist rmdir /s /q dist
      - cmd /c if exist coverage.out del /q coverage.out
    platforms: [windows]
