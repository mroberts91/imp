# 10 — Hardening fields: the unit-file directives, translated (M6).
#
#   LimitNOFILE=65536   ->  rlimits: [{resource: nofile, soft: 65536}]
#   Nice=5              ->  nice: 5
#   OOMScoreAdjust=-100 ->  oomScoreAdjust: -100
#   UMask=0027          ->  umask: "0027"
#   CPUQuota=50%        ->  resources.limits.cpu: "500m"
#
# Everything is applied inside the child before exec (systemd's order):
# rlimits while privileged — so hard limits can be *raised* when impd runs
# as root — then oom_score_adj and nice, then the user/group drop, then
# umask. Rootless impd can only move within its own limits; negative nice
# or oomScoreAdjust need privilege.
#
# One value for an rlimit sets soft and hard alike (LimitNOFILE= semantics);
# -1 means unlimited.
#
#   impctl apply -f examples/10-hardened-daemon.yaml
#   impctl logs hardened
apiVersion: impd.sh/v1alpha1
kind: Daemon
metadata:
  name: hardened
spec:
  template:
    metadata:
      labels:
        app: hardened
    spec:
      command:
        - sh
        - -c
        - 'echo "nofile=$(ulimit -n) umask=$(umask)"; exec sleep 300'
      rlimits:
        - resource: nofile
          soft: 4096
          hard: 8192
        - resource: core
          soft: 0
      nice: 5
      oomScoreAdjust: 100
      umask: "0027"
      resources:
        limits:
          cpu: 500m
